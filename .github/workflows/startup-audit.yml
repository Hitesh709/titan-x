name: Startup Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  import-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Verify FastAPI startup import
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          API_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JWT_SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          TRUSTED_HOSTS: "*"
          DOCS_ENABLED: "false"
        run: python -c "from titan_x.main import app; assert len(app.routes) > 0; print(f'STARTUP OK: {len(app.routes)} routes registered')"
