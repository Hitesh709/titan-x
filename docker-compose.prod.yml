include:
  - docker-compose.yml

# Production reverse proxy. Background jobs run inside the API process on the
# current SQLite/Render architecture; no separate worker or scheduler service
# is defined here.
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - titan_net

volumes:
  nginx_logs:

networks:
  titan_net:
    driver: bridge
