include:
  - docker-compose.yml

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - titan_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: titan-x-worker:${APP_VERSION:-0.1.0}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - titan_net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: titan-x-worker:${APP_VERSION:-0.1.0}
    env_file:
      - .env
    environment:
      SERVICE_MODE: scheduler
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - titan_net
    command: ["python", "-m", "titan_x.infrastructure.scheduler"]

volumes:
  nginx_logs:
  redis_data:

networks:
  titan_net:
    driver: bridge
