# TITAN X — Render Blueprint
# Deploys the full stack: Next.js frontend, FastAPI backend (Docker),
# managed PostgreSQL, managed Redis, and a background worker.
#
# Setup:
#   1. In Render, create a new Blueprint and point it at this repo.
#   2. On first deploy, Render generates API_KEY / JWT_SECRET_KEY (or prompts).
#   3. The frontend (titan-x) proxies /api/v1/* to titan-x-api via next.config.js.

services:
  # ---------- Frontend (Next.js) ----------
  # Named "titan-x" so its onrender subdomain is titan-x.onrender.com, which
  # matches next.config.js (rewrite target) and NEXT_PUBLIC_API_URL.
  - type: web
    name: titan-x
    plan: free
    runtime: node
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Relative base -> same-origin; next.config.js rewrites /api/v1/* to the API service.
      - key: NEXT_PUBLIC_API_URL
        value: https://titan-x.onrender.com/api/v1

  # ---------- Backend API (FastAPI, Docker) ----------
  - type: web
    name: titan-x-api
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DOCS_ENABLED
        value: "false"
      - key: UVICORN_WORKERS
        value: "1"
      # Keep pool within free-tier Postgres connection limits.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: CORS_ORIGINS
        value: https://titan-x.onrender.com
      # Render Postgres provides postgres://...; the entrypoint rewrites it to
      # postgresql+asyncpg:// for SQLAlchemy's async engine.
      - key: DATABASE_URL
        fromDatabase:
          name: titan-x-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: titan-x-redis
          property: connectionString
      # Secrets: generated once by Render (>=32 chars, satisfies validators).
      - key: API_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

  # ---------- Background jobs ----------
  # Render background workers are NOT free (they'd force a $7 Starter instance),
  # so scheduled/background jobs are consumed IN-PROCESS by the API service
  # (run_worker_in_process=true). The stack stays fully free; no worker service.

  # ---------- Redis (managed) ----------
  - type: redis
    name: titan-x-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

# ---------- PostgreSQL (managed) ----------
databases:
  - name: titan-x-db
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
