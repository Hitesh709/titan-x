# TITAN X — Render Blueprint
# Production stack: Next.js frontend, FastAPI backend, managed PostgreSQL and Redis.

services:
  - type: web
    name: titan-x
    plan: free
    runtime: node
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://titan-x-api.onrender.com/api/v1

  - type: web
    name: titan-x-api
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn titan_x.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DOCS_ENABLED
        value: "false"
      - key: UVICORN_WORKERS
        value: "1"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: CORS_ORIGINS
        value: https://titan-x.onrender.com
      - key: SEED_DEMO_ON_STARTUP
        value: "true"
      - key: PAPER_DEMO_PRICES
        value: "false"
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: MARKET_DATA_INGEST_ON_STARTUP
        value: "true"
      - key: MARKET_DATA_INGEST_MAX_SYMBOLS
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: titan-x-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: titan-x-redis
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENABLED
        value: "false"
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: BACKUP_S3_PREFIX
        value: titan-x-backups
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_SECRET_KEY
        sync: false

  - type: redis
    name: titan-x-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: titan-x-db
    plan: basic_256mb
    postgresMajorVersion: "18"
    diskSizeGB: 1
    ipAllowList: []
