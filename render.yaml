# TITAN X — Render Blueprint
# Production stack: Next.js frontend, FastAPI backend, SQLite and Redis.
# SQLite is intentionally used for the current Render deployment.
# The API uses a paid instance because Render Free web services cannot attach
# persistent disks. The disk keeps the SQLite database durable across deploys
# and restarts.

services:
  - type: web
    name: titan-x
    plan: free
    runtime: node
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://titan-x-api-oregon.onrender.com/api/v1
      - key: RENDER_BLUEPRINT_REVISION
        value: "2026-09-04-sqlite-2"

  - type: web
    name: titan-x-api-oregon
    plan: starter
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn titan_x.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /api/v1/health/live
    disk:
      name: titan-x-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DOCS_ENABLED
        value: "false"
      - key: UVICORN_WORKERS
        value: "1"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/titan_x.db
      - key: CORS_ORIGINS
        value: https://titan-x.onrender.com
      - key: FRONTEND_URL
        value: https://titan-x.onrender.com
      - key: TRUSTED_HOSTS
        value: titan-x-api-oregon.onrender.com
      - key: ENABLE_HTTPS_REDIRECT
        value: "false"
      - key: SEED_DEMO_ON_STARTUP
        value: "false"
      - key: ENSURE_DEMO_USER_ON_STARTUP
        value: "true"
      - key: PAPER_DEMO_PRICES
        value: "false"
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: MARKET_DATA_INGEST_ON_STARTUP
        value: "true"
      - key: MARKET_DATA_INGEST_MAX_SYMBOLS
        value: "20"
      - key: ENABLE_TIMESCALEDB
        value: "false"
      - key: RENDER_BLUEPRINT_REVISION
        value: "2026-09-04-sqlite-2"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: titan-x-redis-oregon
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        value: Titan X
      - key: BACKUP_ENABLED
        value: "false"
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: BACKUP_S3_PREFIX
        value: titan-x-backups
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_SECRET_KEY
        sync: false

  - type: keyvalue
    name: titan-x-redis-oregon
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    persistenceMode: snapshot
    ipAllowList: []
