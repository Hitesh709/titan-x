# TITAN X — Render Blueprint
# Production stack: Next.js frontend, FastAPI backend, private MySQL 8 and Redis.
# A fresh MySQL service is used so its generated credentials are initialized together.

services:
  - type: web
    name: titan-x
    plan: free
    runtime: node
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://titan-x-api-oregon.onrender.com/api/v1
      - key: RENDER_BLUEPRINT_REVISION
        value: "2026-09-04-mysql-3"

  - type: web
    name: titan-x-api-oregon
    plan: free
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn titan_x.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DOCS_ENABLED
        value: "false"
      - key: UVICORN_WORKERS
        value: "1"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: CORS_ORIGINS
        value: https://titan-x.onrender.com
      - key: FRONTEND_URL
        value: https://titan-x.onrender.com
      - key: TRUSTED_HOSTS
        value: titan-x-api-oregon.onrender.com
      - key: ENABLE_HTTPS_REDIRECT
        value: "false"
      - key: SEED_DEMO_ON_STARTUP
        value: "true"
      - key: PAPER_DEMO_PRICES
        value: "false"
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: MARKET_DATA_INGEST_ON_STARTUP
        value: "true"
      - key: MARKET_DATA_INGEST_MAX_SYMBOLS
        value: "20"
      - key: ENABLE_TIMESCALEDB
        value: "false"
      - key: RENDER_BLUEPRINT_REVISION
        value: "2026-09-04-mysql-3"
      - key: MYSQL_HOST
        fromService:
          type: pserv
          name: titan-x-mysql-fresh
          property: host
      - key: MYSQL_PORT
        fromService:
          type: pserv
          name: titan-x-mysql-fresh
          property: port
      - key: MYSQL_DATABASE
        value: titan_x
      - key: MYSQL_USER
        value: titan_x
      - key: MYSQL_PASSWORD
        fromService:
          type: pserv
          name: titan-x-mysql-fresh
          envVarKey: MYSQL_PASSWORD
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: titan-x-redis-oregon
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENABLED
        value: "false"
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: BACKUP_S3_PREFIX
        value: titan-x-backups
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_SECRET_KEY
        sync: false

  - type: pserv
    name: titan-x-mysql-fresh
    plan: starter
    runtime: docker
    region: oregon
    dockerfilePath: ./docker/mysql/Dockerfile
    disk:
      name: mysql-fresh-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: titan_x
      - key: MYSQL_USER
        value: titan_x
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: keyvalue
    name: titan-x-redis-oregon
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    persistenceMode: snapshot
    ipAllowList: []
