[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-x"
version = "0.1.0"
description = "TITAN X enterprise API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "bcrypt==4.3.0",
  "cryptography>=46.0.0,<47.0.0",
  "email-validator==2.2.0",
  "fastapi==0.116.1",
  "httpx>=0.28.0",
  "jugaad-data==0.35.5",
  "passlib[bcrypt]==1.7.4",
  "pydantic-settings==2.10.1",
  "pyotp==2.9.0",
  "python-jose[cryptography]==3.3.0",
  "qrcode>=8.2,<9",
  "redis==6.4.0",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]

[project.optional-dependencies]
agent = ["openai>=1.0.0", "anthropic>=0.30.0", "typer>=0.12.0", "rich>=13.0.0", "httpx>=0.28.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.alembic]
env = "alembic/env.py"
config = "alembic.ini"
script_location = "alembic"
prepend_sys_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["smoke: smoke tests that verify a deployed instance"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["titan_x", "coding_agent"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
