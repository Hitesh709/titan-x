    <linearGradient id="metal" x1="260" y1="180" x2="630" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#F7FBFF"/><stop offset=".15" stop-color="#6B879A"/><stop offset=".35" stop-color="#101A24"/><stop offset=".55" stop-color="#4B5D69"/><stop offset=".72" stop-color="#070B12"/><stop offset="1" stop-color="#263744"/></linearGradient>
